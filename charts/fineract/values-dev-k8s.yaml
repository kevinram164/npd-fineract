# Argo CD (dev-k8s) — Postgres = platform postgres-ha (không deploy DB trong chart).
# Image: giữ openmf/* đến khi Jenkins mirror vào Harbor (Bước 4).

namespace: npd-fineract
imagePullSecrets:
  - name: harbor-pull-creds

fineract:
  image:
    repository: openmf/fineract
    tag: develop
    pullPolicy: IfNotPresent
  jdbcUrl: jdbc:postgresql://postgres-ha-postgresql-primary.postgres.svc.cluster.local:5432/fineract_tenants
  tenantDb:
    host: postgres-ha-postgresql-primary.postgres.svc.cluster.local
    port: "5432"

webapp:
  image:
    repository: openmf/web-app
    tag: dev
    pullPolicy: IfNotPresent
  fineractApiUrl: http://fineract.npd.co

# Tắt Postgres embed — dùng postgres-ha + Job fineract-db-init
postgres:
  enabled: false

ingress:
  enabled: true
  className: haproxy
  hosts:
    fineract: fineract.npd.co
    webapp: mifos.npd.co

vault:
  enabled: false

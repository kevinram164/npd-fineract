# Argo CD (dev-k8s) — sau Bước 1–3 (Harbor + Vault + pull-secret)
# Image: giữ openmf/* đến khi Jenkins mirror vào Harbor (Bước 4), rồi đổi repository.

namespace: npd-fineract
imagePullSecrets:
  - name: harbor-pull-creds

fineract:
  image:
    repository: openmf/fineract
    tag: develop
    pullPolicy: IfNotPresent

webapp:
  image:
    repository: openmf/web-app
    tag: dev
    pullPolicy: IfNotPresent
  fineractApiUrl: http://fineract.npd.co

postgres:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: nfs-csi

ingress:
  enabled: true
  className: haproxy
  hosts:
    fineract: fineract.npd.co
    webapp: mifos.npd.co

vault:
  enabled: false

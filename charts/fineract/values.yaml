# Defaults — override bằng values-dev-k8s.yaml (Argo)

namespace: npd-fineract

# Bootstrap: Docker Hub images → để trống. Sau này Harbor → thêm harbor-pull-creds
imagePullSecrets: []

fineract:
  enabled: true
  replicaCount: 1
  image:
    repository: openmf/fineract
    tag: develop
    pullPolicy: IfNotPresent
  service:
    port: 8080
  jdbcUrl: jdbc:postgresql://fineractdb:5432/fineract_tenants
  tenantDb:
    host: fineractdb
    port: "5432"
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  env:
    FINERACT_NODE_ID: "1"
    FINERACT_SERVER_SSL_ENABLED: "false"
    FINERACT_SERVER_PORT: "8080"
    FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
    JAVA_TOOL_OPTIONS: "-Xmx1G -XX:MaxMetaspaceSize=256m"
  existingSecret: fineract-tenants-db-secret

webapp:
  enabled: true
  replicaCount: 1
  image:
    repository: openmf/web-app
    tag: dev
    pullPolicy: IfNotPresent
  # Phải khớp ingress host fineract (http lab)
  fineractApiUrl: http://fineract.npd.co
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 1Gi

postgres:
  enabled: true
  image: postgres:17.5
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

ingress:
  enabled: true
  className: haproxy
  hosts:
    fineract: fineract.npd.co
    webapp: mifos.npd.co
  tls: []

observability:
  otelEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  otelServiceName: fineract-server
  extraEnv:
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev-k8s,k8s.namespace.name=npd-fineract,k8s.cluster.name=npd-k8s"

vault:
  enabled: false
  role: fineract-app

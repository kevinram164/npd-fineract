# Default values — override bằng deploy/dev-k8s/values/*.yaml

namespace: npd-fineract

imagePullSecrets:
  - name: harbor-pull-creds

fineract:
  enabled: true
  replicaCount: 1
  image:
    repository: npd-harbor.co/npd-fineract/fineract-server
    tag: bootstrap
    pullPolicy: IfNotPresent
  # Lab bootstrap: có thể trỏ image upstream trước khi Jenkins build
  # repository: apache/fineract
  # tag: latest
  service:
    port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  env:
    FINERACT_NODE_ID: "1"
    FINERACT_SERVER_SSL_ENABLED: "false"
    FINERACT_SERVER_PORT: "8080"
    FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
    JAVA_TOOL_OPTIONS: "-Xmx1G -XX:MaxMetaspaceSize=256m"
  # DB URL/user/pass: Vault inject (values-vault) hoặc secretName
  existingSecret: fineract-tenants-db-secret

webapp:
  enabled: true
  replicaCount: 1
  image:
    repository: openmf/web-app
    tag: dev
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 1Gi

postgres:
  # Lab only — production: external Postgres + Vault
  enabled: true
  image: postgres:17.5
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""   # set cluster default / longhorn / local-path
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    fineract: fineract.npd.co
    webapp: mifos.npd.co
  tls: []

observability:
  otelEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  otelServiceName: fineract-server
  # Phase 4: gắn OTel Java agent / Instana agent qua extraEnv hoặc initContainer
  extraEnv: {}

vault:
  enabled: false
  role: fineract-app

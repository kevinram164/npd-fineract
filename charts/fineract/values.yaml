# Defaults — override bằng values-dev-k8s.yaml (Argo)

namespace: npd-fineract

# Bootstrap: Docker Hub images → để trống. Sau này Harbor → thêm harbor-pull-creds
imagePullSecrets: []

fineract:
  enabled: true
  replicaCount: 1
  image:
    repository: openmf/fineract
    tag: develop
    pullPolicy: IfNotPresent
  service:
    port: 8080
  jdbcUrl: jdbc:postgresql://postgres-ha-postgresql-primary.postgres.svc.cluster.local:5432/fineract_tenants
  tenantDb:
    host: postgres-ha-postgresql-primary.postgres.svc.cluster.local
    port: "5432"
  resources:
    requests:
      cpu: 200m
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 3Gi
  env:
    FINERACT_NODE_ID: "1"
    FINERACT_SERVER_SSL_ENABLED: "false"
    FINERACT_SERVER_PORT: "8080"
    FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
    FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
    FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
    FINERACT_DEFAULT_TENANTDB_TIMEZONE: UTC
    # Image phải chứa từ Dockerfile có /otel/opentelemetry-javaagent.jar
    JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -Xmx1536m -XX:MaxMetaspaceSize=256m"
  existingSecret: fineract-tenants-db-secret

webapp:
  enabled: true
  replicaCount: 1
  image:
    repository: openmf/web-app
    tag: dev
    pullPolicy: IfNotPresent
  # Phải khớp ingress host API (f5-lb TLS)
  fineractApiUrl: https://npd-fineract.co
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 1Gi

# Mặc định tắt — dùng postgres-ha platform. Bật chỉ khi lab offline không có HA.
postgres:
  enabled: false
  image: postgres:17.5
  persistence:
    enabled: true
    size: 10Gi
    storageClass: nfs-csi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

ingress:
  enabled: true
  className: haproxy
  hosts:
    fineract: npd-fineract.co
    webapp: npd-mifos.co
  tls: []

observability:
  otelEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  otelServiceName: fineract-server
  extraEnv:
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev-k8s,k8s.namespace.name=npd-fineract,k8s.cluster.name=npd-k8s"

vault:
  enabled: false
  role: fineract-app

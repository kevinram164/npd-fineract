{{- if .Values.webapp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mifos-webapp
  namespace: {{ .Values.namespace }}
  labels:
    app: mifos-webapp
    {{- include "fineract.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webapp.replicaCount }}
  selector:
    matchLabels:
      app: mifos-webapp
  template:
    metadata:
      labels:
        app: mifos-webapp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webapp
          image: "{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag }}"
          imagePullPolicy: {{ .Values.webapp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.webapp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mifos-webapp
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: mifos-webapp
  ports:
    - name: http
      port: {{ .Values.webapp.service.port }}
      targetPort: http
{{- end }}

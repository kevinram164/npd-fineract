{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fineract
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.fineract | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fineract-server
                port:
                  number: {{ .Values.fineract.service.port }}
    - host: {{ .Values.ingress.hosts.webapp | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mifos-webapp
                port:
                  number: {{ .Values.webapp.service.port }}
{{- end }}

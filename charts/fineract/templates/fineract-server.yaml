{{- if .Values.fineract.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fineract-server
  namespace: {{ .Values.namespace }}
  labels:
    app: fineract-server
    tier: backend
    {{- include "fineract.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.fineract.replicaCount }}
  selector:
    matchLabels:
      app: fineract-server
      tier: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: fineract-server
        tier: backend
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-pre-populate-only: "true"
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fineract-server
          image: "{{ .Values.fineract.image.repository }}:{{ .Values.fineract.image.tag }}"
          imagePullPolicy: {{ .Values.fineract.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.fineract.service.port }}
          env:
            {{- range $k, $v := .Values.fineract.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: FINERACT_HIKARI_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fineract.existingSecret }}
                  key: jdbc-url
                  optional: true
            - name: FINERACT_HIKARI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fineract.existingSecret }}
                  key: username
            - name: FINERACT_HIKARI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fineract.existingSecret }}
                  key: password
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otelEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.observability.otelServiceName | quote }}
            {{- range $k, $v := .Values.observability.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.fineract.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fineract-server
  namespace: {{ .Values.namespace }}
  labels:
    app: fineract-server
spec:
  selector:
    app: fineract-server
    tier: backend
  ports:
    - name: http
      port: {{ .Values.fineract.service.port }}
      targetPort: http
{{- end }}

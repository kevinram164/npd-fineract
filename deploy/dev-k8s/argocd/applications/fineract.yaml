apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fineract-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fineract
  sources:
    - repoURL: https://github.com/kevinram164/npd-fineract.git
      targetRevision: dev-k8s
      path: charts/fineract
      helm:
        valueFiles:
          - values-dev-k8s.yaml
          - $values/deploy/dev-k8s/values/values-images.yaml
          - $values/deploy/dev-k8s/values/values-observability.yaml
    - repoURL: https://github.com/kevinram164/npd-fineract.git
      targetRevision: dev-k8s
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: npd-fineract
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

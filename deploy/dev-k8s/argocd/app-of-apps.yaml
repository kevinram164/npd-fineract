# kubectl apply -f deploy/dev-k8s/argocd/appproject.yaml -f deploy/dev-k8s/argocd/app-of-apps.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fineract-root-dev-k8s
  namespace: argocd
spec:
  project: fineract
  source:
    repoURL: https://github.com/kevinram164/npd-fineract.git
    targetRevision: dev-k8s
    path: deploy/dev-k8s/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

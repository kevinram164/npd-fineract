# Jenkins GitOpsUpdater bump `tag` (quote SHA). Argo load file này sau values-dev-k8s.
# Lần đầu: chạy scripts/mirror-images-to-harbor.sh (tag bootstrap) hoặc đợi Jenkins build.

fineract:
  image:
    repository: npd-harbor.co/npd-fineract/fineract-server
    tag: "bootstrap"
    pullPolicy: Always

webapp:
  image:
    repository: npd-harbor.co/npd-fineract/web-app
    tag: "bootstrap"
    pullPolicy: Always

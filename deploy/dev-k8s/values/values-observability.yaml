# Trỏ collector platform — dual Elastic APM + Instana (otlp/instana → agent :4317)
observability:
  otelEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  otelServiceName: fineract-server
  extraEnv:
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_TRACES_EXPORTER: "otlp"
    OTEL_METRICS_EXPORTER: "otlp"
    OTEL_LOGS_EXPORTER: "otlp"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev-k8s,k8s.namespace.name=npd-fineract,k8s.cluster.name=npd-k8s,service.namespace=npd-fineract"
    # Giảm noise; bật thêm nếu cần debug agent
    OTEL_JAVAAGENT_LOGGING: "none"
    # Map X-Correlation-ID vào MDC log (ecosystem synthetic)
    FINERACT_LOGGING_HTTP_CORRELATION_ID_ENABLED: "true"
    FINERACT_LOGGING_HTTP_CORRELATION_ID_HEADER_NAME: "X-Correlation-ID"
    # Instana: index header → tag span (search được corr / BPM flow trên Traces)
    # Tag dạng: http.request.header.x_correlation_id , http.request.header.x_business_flow
    OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: "X-Correlation-ID,X-Business-Flow,X-Business-Step"
    # Grafana p95: Micrometer histogram cho http.server.requests
    FINERACT_MANAGEMENT_PROMETHEUS_ENABLED: "true"
    FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    FINERACT_MANAGEMENT_METRICS_DISTRIBUTION_HTTP_SERVER_REQUESTS: "true"
